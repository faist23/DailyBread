name: DailyReadings
options:
  bundleIdPrefix: com.ridepro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: DT58WA8N32
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "14"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    GENERATE_INFOPLIST_FILE: true

schemes:
  DailyReadings:
    build:
      targets:
        DailyReadings: all
        DailyReadingsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyReadingsTests
    archive:
      config: Release

targets:
  DailyReadings:
    type: application
    platform: iOS
    sources:
      - path: DailyReadings
        excludes:
          - "**/*.metadata.json"
          - ".DS_Store"
    resources:
      - path: DailyReadings/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: DailyReadings/Resources/bible_drb.sqlite
        buildPhase: resources
      - path: DailyReadings/Resources/saints.json
        buildPhase: resources
      - path: DailyReadings/Resources/lectionary.json
        buildPhase: resources
      - path: DailyReadings/Resources/lectionary_dates.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridepro.DailyReadings
        PRODUCT_NAME: DailyReadings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: DailyReadings/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: DailyReadings
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies: []

  DailyReadingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyReadingsTests
    dependencies:
      - target: DailyReadings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridepro.DailyReadingsTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
